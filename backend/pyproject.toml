[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for Letterboxd AI Roaster"
readme = "README.md"
authors = [
    { name = "anthony.dev", email = "anthonylumantao.dev@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "google-genai>=0.1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]